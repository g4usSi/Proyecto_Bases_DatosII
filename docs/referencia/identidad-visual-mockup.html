<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Identidad visual Historiales</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Archivo:wdth,wght@62..125,300..800&family=Lexend:wght@300..800&display=swap">
<style>
/* Concepto: un acceso, cuatro casas. La estructura (pantallas, permisos, posición de las acciones)
   es la misma en las cuatro; cada institución cambia de piel: color, tipografía, forma y una pieza
   propia (pulsera, cartilla, etiqueta de muestra, odontograma). El login es neutro a propósito:
   no puede adivinar la institución antes de autenticar. */

:root{
  --pg-bg:#ECEFF2; --pg-fg:#171B22; --pg-muted:#59616F; --pg-line:#D1D6DD; --pg-card:#FFFFFF;
  --pg-ink:#171B22; --pg-ink-fg:#FFFFFF; --pg-focus:#2B5CFF; --pg-soft:#E2E6EB;
  --sans:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --pg-bg:#13161B; --pg-fg:#E7EAEF; --pg-muted:#9AA3B0; --pg-line:#2C323B; --pg-card:#1B1F26;
  --pg-ink:#E7EAEF; --pg-ink-fg:#13161B; --pg-focus:#8FB0FF; --pg-soft:#242932; color-scheme:dark}}
:root[data-theme="dark"]{
  --pg-bg:#13161B; --pg-fg:#E7EAEF; --pg-muted:#9AA3B0; --pg-line:#2C323B; --pg-card:#1B1F26;
  --pg-ink:#E7EAEF; --pg-ink-fg:#13161B; --pg-focus:#8FB0FF; --pg-soft:#242932; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--pg-bg);color:var(--pg-fg);font:15px/1.5 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--pg-bg)}
button{font:inherit}

/* ===== Barra de revisión (fuera del producto) ===== */
.rv{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pg-bg);border-bottom:1px solid var(--pg-line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:grid;gap:8px}
.rv-in{max-width:1320px;margin:0 auto;width:100%;display:grid;gap:8px}
.rv-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;min-width:0}
.rv-tit{display:flex;align-items:center;gap:10px;font-weight:700}
.rv-tit small{font-weight:500;color:var(--pg-muted)}
.rv-mark{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:20px;height:20px}
.rv-mark i{border-radius:3px}
.rv-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;min-width:0;max-width:100%}
.rv-tab{flex:none;border:1px solid var(--pg-line);background:var(--pg-card);color:var(--pg-fg);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600}
.rv-tab[aria-selected="true"]{background:var(--pg-ink);color:var(--pg-ink-fg);border-color:var(--pg-ink)}
.rv-ctl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;color:var(--pg-muted)}
.rv-ctl label{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.rv-ctl select{border:1px solid var(--pg-line);background:var(--pg-card);color:var(--pg-fg);border-radius:8px;padding:6px 10px;font:inherit;max-width:100%}
.rv-seg{display:inline-flex;border:1px solid var(--pg-line);border-radius:8px;overflow:hidden;background:var(--pg-card)}
.rv-seg button{border:0;background:transparent;color:var(--pg-fg);padding:6px 12px;cursor:pointer;font-weight:600}
.rv-seg button[aria-pressed="true"]{background:var(--pg-ink);color:var(--pg-ink-fg)}
.rv :focus-visible,.sis :focus-visible{outline:3px solid var(--pg-focus);outline-offset:2px}
.rv-note{margin-left:auto;font-size:13px}

.stage{max-width:1320px;margin:18px auto 0}
.frame{position:relative;overflow:hidden;border:1px solid var(--pg-line);border-radius:12px;background:#fff;color-scheme:light}
.frame-note{max-width:1320px;margin:10px auto 0;color:var(--pg-muted);font-size:14px}

/* ===== Producto: base compartida (cada institución redefine los tokens) ===== */
.app{--bg:#fff;--surface:#fff;--ink:#111;--muted:#555;--line:#ccc;--line-strong:#111;--brand:#1F3FD6;--brand-ink:#fff;--brand-tint:#E6EBFD;
  --alert:#B3261E;--alert-tint:#FDECEA;--ok:#13693F;--ok-tint:#E3F3EA;--focus:#1F3FD6;--bw:1px;--btn-line:var(--brand);--r-btn:8px;--r-in:8px;--r-card:12px;--nav-w:240px;
  --font:system-ui,sans-serif;
  position:relative;min-height:800px;display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
:where(.app) button,:where(.app) input,:where(.app) select,:where(.app) textarea{font:inherit;color:inherit}
.app :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app h1,.app h2,.app h3,.app p{margin:0}
.app ul{margin:0;padding:0;list-style:none}
.app svg.ic{flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:var(--bw) solid var(--btn-line);border-radius:var(--r-btn);
  background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(.93)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn.danger{background:var(--surface);color:var(--alert);border-color:var(--alert)}
.btn.danger.solid{background:var(--alert);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.in{width:100%;min-height:44px;padding:9px 12px;border:var(--bw) solid var(--line-strong);border-radius:var(--r-in);background:var(--surface)}
textarea.in{min-height:92px;resize:vertical}
.in[aria-invalid="true"]{border-color:var(--alert);background:var(--alert-tint)}
.fl{display:grid;gap:6px;min-width:0}
.fl>label,.lbl{font-weight:700;font-size:14px}
.hint{color:var(--muted);font-size:13px}
.err{color:var(--alert);font-size:13px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:999px;font-size:13px;font-weight:700;border:1.5px solid currentColor;line-height:1.6;background:var(--surface)}
.chip.alert{color:var(--alert);background:var(--alert-tint)}
.chip.ok{color:var(--ok);background:var(--ok-tint)}
.chip.mut{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.vacio{display:grid;gap:10px;justify-items:start;padding:28px;color:var(--muted)}
.vacio strong{color:var(--ink);font-size:17px}
.alerta{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:var(--bw) solid var(--alert);background:var(--alert-tint);color:var(--alert);border-radius:var(--r-in);font-weight:700}
.alerta.info{border-color:var(--line-strong);background:var(--surface);color:var(--ink)}
.errorbox{display:grid;gap:12px;justify-items:start;padding:32px;background:var(--surface);border:var(--bw) solid var(--line-strong);border-radius:var(--r-card);max-width:560px}
.errorbox h2{font-size:22px}

/* Menú y estructura */
.nav{display:flex;flex-direction:column;gap:6px;padding:20px 0 16px 16px}
.brand{display:grid;gap:2px;margin-bottom:18px;padding-right:16px}
.navlist{display:grid;gap:4px}
.nv{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border:0;background:transparent;color:inherit;cursor:pointer;text-align:left;font-weight:700}
.who{margin-top:auto;display:grid;gap:2px;padding:14px 16px 0 0;font-size:14px}
.who b{font-size:15px}
.who button{justify-self:start;margin-top:8px;border:0;background:transparent;color:inherit;text-decoration:underline;cursor:pointer;padding:6px 0;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.main{padding:24px 28px 40px;min-width:0}
.content{max-width:1120px;margin:0 auto;display:grid;gap:18px}
.pac{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.lista{display:grid;gap:10px;align-content:start}
.res{display:grid;gap:6px}
.fila{width:100%;display:grid;gap:2px;text-align:left;padding:10px 12px;border:var(--bw) solid var(--line);background:var(--surface);border-radius:var(--r-in);cursor:pointer}
.fila[aria-current="true"]{border-color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
.fila b{font-size:15px}
.fila .meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:13px;align-items:center}
.ficha{display:grid;gap:16px;min-width:0}
.fside{display:grid;gap:12px;align-content:start;min-width:0}
.fbody{display:grid;gap:12px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{min-height:44px;padding:0 16px;border:var(--bw) solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:700}
.panel{display:grid;gap:12px;min-width:0}
.acciones{display:flex;flex-wrap:wrap;gap:8px}
.datos{display:grid;gap:12px}
.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;padding:14px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card)}
.dl dt{color:var(--muted);font-size:14px}
.dl dd{margin:0}
.dl dd.none{color:var(--muted)}
.lst{display:grid;gap:4px}
.lst li{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.cod{font-size:13px;font-weight:700;padding:0 7px;border-radius:4px;background:var(--brand-tint);color:var(--ink)}
.rxl{display:grid;gap:8px}
.rxl li{display:grid;gap:1px}
.rxl em{color:var(--muted);font-size:14px}
.rxt{width:100%;border-collapse:collapse;font-size:14px}
.rxt th,.rxt td{text-align:left;padding:6px 10px;border:1px solid var(--line);vertical-align:top}
.rxt th{font-weight:700;background:var(--brand-tint)}
.tw{overflow-x:auto}
.arch{display:flex;gap:10px;padding:12px 14px;border:var(--bw) solid var(--line-strong);background:var(--surface);border-radius:var(--r-in)}

/* Drawer, modal y aviso */
.scrim{position:absolute;inset:0;background:rgba(10,12,18,.45);z-index:40;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.drawer{width:min(540px,100%);height:100%;overflow:auto;background:var(--bg);padding:22px 24px 28px;display:grid;gap:16px;align-content:start;border-left:var(--bw) solid var(--line-strong)}
.modal{width:min(480px,100%);max-height:100%;overflow:auto;background:var(--surface);padding:22px 24px;display:grid;gap:14px;border:var(--bw) solid var(--line-strong);border-radius:var(--r-card)}
.drawer h2,.modal h2{font-size:22px}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.xbtn{border:var(--bw) solid var(--line-strong);background:var(--surface);width:40px;height:40px;border-radius:var(--r-in);display:grid;place-items:center;cursor:pointer;flex:none}
.sec-b{display:grid;gap:10px;padding:14px;border:var(--bw) solid var(--line);background:var(--surface);border-radius:var(--r-card)}
.sec-b h3{font-size:16px}
.rep{display:grid;gap:10px;padding:10px;border:1px dashed var(--line-strong);border-radius:var(--r-in)}
.rep-h{display:flex;justify-content:flex-end}
.radios{display:grid;gap:8px}
.radios label{display:flex;gap:10px;align-items:center;min-height:40px;padding:0 12px;border:var(--bw) solid var(--line);border-radius:var(--r-in);background:var(--surface);cursor:pointer}
.radios input{width:18px;height:18px;accent-color:var(--brand)}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;gap:10px;align-items:center;padding:12px 18px;background:#111;color:#fff;border-radius:10px;font-weight:700;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}

/* ===== Login neutro ===== */
.login{min-height:760px;display:grid;grid-template-columns:minmax(380px,520px) minmax(0,1fr);background:#fff;color:#171B22;font-family:'Schibsted Grotesk',system-ui,sans-serif}
.lg-form{display:flex;flex-direction:column;justify-content:center;gap:22px;padding:48px clamp(24px,5vw,64px)}
.lg-brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:22px;letter-spacing:-.01em}
.lg-mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:30px;height:30px}
.lg-mark i{border-radius:5px}
.lg-form h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;font-weight:800;text-wrap:balance;margin:0}
.lg-form p{margin:0;color:#4B5360;max-width:42ch}
.lg-form form{display:grid;gap:16px}
.lg-f{display:grid;gap:6px}
.lg-f label{font-weight:700;font-size:14px}
.lg-in{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid #171B22;border-radius:10px;font:inherit;background:#fff;color:#171B22}
.lg-in[aria-invalid="true"]{border-color:#B3261E;background:#FDECEA}
.lg-pw{position:relative}
.lg-pw .lg-in{padding-right:92px}
.lg-pw button{position:absolute;right:6px;top:6px;height:36px;padding:0 12px;border:0;background:#EEF0F3;border-radius:7px;font-weight:700;cursor:pointer;color:#171B22}
.lg-go{min-height:50px;border:0;border-radius:10px;background:#171B22;color:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.lg-go:hover{background:#2A303A}
.lg-go[disabled]{opacity:.6;cursor:progress}
.lg-alert{padding:12px 14px;border-radius:10px;font-weight:700;border:1.5px solid #B3261E;background:#FDECEA;color:#8F1D17}
.lg-alert.info{border-color:#171B22;background:#F2F4F7;color:#171B22}
.lg-err{color:#B3261E;font-size:13px;font-weight:700}
.lg-help{font-size:14px;color:#4B5360}
.lg-form :focus-visible{outline:3px solid #2B5CFF;outline-offset:2px}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;min-height:420px}
.tile{position:relative;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;overflow:hidden}
.tile svg{width:64px;height:64px}
.tile b{display:block;font-size:clamp(24px,3vw,38px);line-height:1.02;text-wrap:balance}
.t-h{background:#1F3FD6;color:#fff;font-family:'Atkinson Hyperlegible',sans-serif}
.t-h b{font-weight:700;letter-spacing:-.01em}
.t-p{background:#FF8A3D;color:#0D3B3B;font-family:'Bricolage Grotesque',sans-serif}
.t-p b{font-weight:800;font-stretch:80%;letter-spacing:-.02em}
.t-l{background:#6A38C8;color:#fff;font-family:'Archivo',sans-serif}
.t-l b{font-weight:700;font-stretch:112%;letter-spacing:-.01em}
.t-o{background:#A3234F;color:#fff;font-family:'Lexend',sans-serif}
.t-o b{font-weight:600;letter-spacing:-.02em}
.veil{position:absolute;inset:0;z-index:80;display:grid;place-items:center;pointer-events:all}
.veil.t-h span{font-weight:700}.veil.t-p span{font-weight:800;font-stretch:80%}.veil.t-l span{font-weight:700;font-stretch:112%}.veil.t-o span{font-weight:600}
.veil span{font-size:clamp(30px,5vw,56px);line-height:1.05;text-align:center;padding:24px;text-wrap:balance}

/* ===== HOSPITAL GENERAL: formulario en triplicado ===== */
.app[data-tema="hospital_general"]{
  --font:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --bg:#EDEFF4;--surface:#FFFFFF;--ink:#111827;--muted:#515B70;--line:#C3CAD9;--line-strong:#111827;
  --brand:#1F3FD6;--brand-ink:#FFFFFF;--brand-tint:#E6EBFD;--alert:#B3261E;--alert-tint:#FDECEA;--ok:#13693F;--ok-tint:#E3F3EA;--focus:#1F3FD6;
  --bw:1.5px;--r-btn:3px;--r-in:3px;--r-card:3px;--nav-w:244px}
.app[data-tema="hospital_general"] .nav{background:var(--brand);color:#fff}
.app[data-tema="hospital_general"] .brand strong{font-size:21px;line-height:1.1;font-weight:700}
.app[data-tema="hospital_general"] .brand span{font-size:13px;color:#D6DDFF}
.app[data-tema="hospital_general"] .nv{border-radius:3px 0 0 3px}
.app[data-tema="hospital_general"] .nv:hover{background:rgba(255,255,255,.14)}
.app[data-tema="hospital_general"] .nv[aria-current="page"]{background:var(--bg);color:var(--brand)}
.app[data-tema="hospital_general"] .who{color:#E6EBFF}
.app[data-tema="hospital_general"] .main h1{font-size:30px;line-height:1.1;letter-spacing:-.01em;font-weight:700}
.app[data-tema="hospital_general"] .btn{border-color:var(--ink)}
.app[data-tema="hospital_general"] .btn:not(.sec):not(.danger){border-color:var(--brand)}
.app[data-tema="hospital_general"] .tabs{gap:0;align-items:flex-end;padding-left:10px}
.app[data-tema="hospital_general"] .tab{border-radius:3px 3px 0 0;background:#DCE1EB;margin-right:-1.5px;border-bottom:0}
.app[data-tema="hospital_general"] .tab[aria-selected="true"]{background:#F8F9FC;position:relative;z-index:1;margin-bottom:-1.5px;min-height:48px;color:var(--brand)}
.app[data-tema="hospital_general"] .panel{border:1.5px solid var(--ink);background:#F8F9FC;padding:16px;position:relative}
.pulsera{position:relative;display:flex;align-items:stretch;background:var(--surface);border:1.5px solid var(--ink);border-radius:999px;padding:0 40px;min-height:88px}
.pulsera::before,.pulsera::after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--bg);border:1.5px solid var(--ink)}
.pulsera::before{left:14px}.pulsera::after{right:14px}
.pulsera .seg{padding:12px 18px;border-left:1.5px dashed var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.pulsera .seg.nom{border-left:0;flex:1 1 260px;padding-left:4px}
.pulsera .seg.nom strong{font-size:23px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.pulsera .cap{font-size:12px;color:var(--muted)}
.pulsera b{font-size:16px}
.folio{background:var(--surface);border:1.5px solid var(--ink)}
.fo-h{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 14px;background:var(--brand-tint);border-bottom:1.5px solid var(--ink)}
.fo-h strong{font-size:17px}
.fo-h .chip{margin-left:auto}
.fo-b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px}
.fo-b .full{grid-column:1/-1}
.campo{border:1.5px solid var(--ink);padding:6px 10px 10px;min-width:0;background:#fff}
.campo .cap{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}

/* ===== CENTRO PEDIÁTRICO: cartilla de crecimiento ===== */
.app[data-tema="centro_pediatrico"]{
  --font:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --bg:#FFF1B8;--surface:#FFFFFF;--ink:#0D3B3B;--muted:#3E6161;--line:#0D3B3B;--line-strong:#0D3B3B;
  --brand:#FF8A3D;--brand-ink:#0D3B3B;--brand-tint:#FFE3CC;--alert:#B3261E;--alert-tint:#FFE1DC;--ok:#0B6B4B;--ok-tint:#D9F3E6;--focus:#0D3B3B;
  --bw:2px;--btn-line:#0D3B3B;--r-btn:999px;--r-in:14px;--r-card:22px;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
.app[data-tema="centro_pediatrico"] .main{
  background-image:linear-gradient(rgba(255,138,61,.30) 1px,transparent 1px),linear-gradient(90deg,rgba(255,138,61,.30) 1px,transparent 1px),
    linear-gradient(rgba(255,138,61,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(255,138,61,.14) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px}
.app[data-tema="centro_pediatrico"] .nav{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:14px 28px;background:#0D3B3B;color:#fff}
.app[data-tema="centro_pediatrico"] .brand{margin:0;padding:0;display:flex;gap:10px;align-items:baseline}
.app[data-tema="centro_pediatrico"] .brand strong{font-size:24px;font-weight:800;font-stretch:80%;color:#FFD23F;letter-spacing:-.01em}
.app[data-tema="centro_pediatrico"] .brand span{font-size:14px;color:#BFE0DA}
.app[data-tema="centro_pediatrico"] .navlist{display:flex;gap:6px;flex-wrap:wrap}
.app[data-tema="centro_pediatrico"] .nv{border-radius:999px;padding:0 18px}
.app[data-tema="centro_pediatrico"] .nv:hover{background:rgba(255,255,255,.14)}
.app[data-tema="centro_pediatrico"] .nv[aria-current="page"]{background:#FFD23F;color:#0D3B3B}
.app[data-tema="centro_pediatrico"] .who{margin:0 0 0 auto;display:flex;gap:14px;align-items:center;padding:0;color:#E4F3F0}
.app[data-tema="centro_pediatrico"] .who button{margin:0}
.app[data-tema="centro_pediatrico"] .who .rol{display:none}
.app[data-tema="centro_pediatrico"] :focus-visible{outline-color:#0D3B3B}
.app[data-tema="centro_pediatrico"] .nav :focus-visible{outline-color:#FFD23F}
.app[data-tema="centro_pediatrico"] .main h1{font-size:34px;line-height:1.05;font-weight:800;font-stretch:80%;letter-spacing:-.02em}
.app[data-tema="centro_pediatrico"] .dl,.app[data-tema="centro_pediatrico"] .sec-b{background:var(--surface)}
.app[data-tema="centro_pediatrico"] .fila{border-width:2px}
.app[data-tema="centro_pediatrico"] .fila[aria-current="true"]{background:#FFD23F;box-shadow:none;border-color:var(--ink)}
.app[data-tema="centro_pediatrico"] .tab{border-radius:999px;padding:0 20px}
.app[data-tema="centro_pediatrico"] .tab[aria-selected="true"]{background:var(--ink);color:#FFD23F}
.pedhead{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;padding:22px 28px;background:#fff;border:2px solid var(--ink);border-radius:30px}
.pedhead svg.curv{position:absolute;right:0;top:0;height:100%;width:56%;pointer-events:none}
.pedhead>*:not(.curv){position:relative}
.edad{display:flex;gap:12px;align-items:center}
.disc{display:grid;place-items:center;width:104px;height:104px;border-radius:50%;border:2px solid var(--ink);text-align:center;line-height:1;align-content:center;gap:2px}
.disc b{font-size:54px;font-weight:800;font-stretch:78%;letter-spacing:-.03em;line-height:.95}
.disc span{font-size:15px;font-weight:700}
.disc.a{background:var(--brand)}.disc.m{background:#FFD23F}
.pedhead h2{font-size:34px;line-height:1.02;font-weight:800;font-stretch:80%;letter-spacing:-.02em;text-wrap:balance}
.pedhead .row{margin-top:10px}
.sticker{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;padding:16px;background:#fff;border:2px solid var(--ink);border-radius:24px}
.fecha-b{display:grid;align-content:center;justify-items:center;background:#FFD23F;border:2px solid var(--ink);border-radius:18px;padding:8px 4px;line-height:1.05;height:fit-content}
.fecha-b b{font-size:32px;font-weight:800;font-stretch:80%}
.fecha-b span{font-size:14px;font-weight:700}
.fecha-b small{font-size:12px}
.sticker h3{font-size:20px;line-height:1.2;font-weight:700;margin-bottom:6px}
.sticker .quien{color:var(--muted);font-size:14px;margin-bottom:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pill{padding:3px 12px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;font-weight:600;font-size:14px}
.pill.tx{background:#FFD23F}
.pill .cod{background:transparent;padding:0 4px 0 0}
.rxcard{display:grid;gap:2px;padding:8px 12px;border-radius:14px;background:var(--brand-tint);border:1.5px solid var(--ink)}
.stk-sec{display:grid;gap:4px}
.stk-sec>b{font-size:14px}

/* ===== LABORATORIO CLÍNICO: etiqueta de muestra ===== */
.app[data-tema="laboratorio_clinico"]{
  --font:'Archivo','Segoe UI',system-ui,sans-serif;
  --bg:#F5F4FA;--surface:#FFFFFF;--ink:#1B1733;--muted:#5C5877;--line:#D9D6E8;--line-strong:#8A84AD;
  --brand:#6A38C8;--brand-ink:#FFFFFF;--brand-tint:#EFE9FB;--alert:#B3261E;--alert-tint:#FDECEA;--ok:#14663F;--ok-tint:#E1F3E9;--focus:#6A38C8;
  --edta:#A98BE0;--sst:#E3B23C;--cit:#7FC1E8;--hep:#43A971;--flu:#9BA3AE;--ser:#D6483F;
  --bw:1px;--r-btn:8px;--r-in:8px;--r-card:10px;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
.app[data-tema="laboratorio_clinico"] .nav{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 28px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}
.app[data-tema="laboratorio_clinico"] .brand{margin:0;padding:12px 0;display:flex;gap:12px;align-items:center}
.app[data-tema="laboratorio_clinico"] .brand strong{font-size:19px;font-weight:700;font-stretch:112%;letter-spacing:-.01em}
.app[data-tema="laboratorio_clinico"] .brand span{display:none}
.caps{display:flex;gap:3px;align-items:flex-end}
.caps i{display:block;width:7px;height:22px;border-radius:3px 3px 5px 5px}
.app[data-tema="laboratorio_clinico"] .navlist{display:flex;gap:4px;align-self:stretch;max-width:100%;overflow-x:auto;scrollbar-width:thin}
.app[data-tema="laboratorio_clinico"] .nv{border-bottom:3px solid transparent;border-radius:0;padding:0 14px;min-height:60px}
.app[data-tema="laboratorio_clinico"] .nv[aria-current="page"]{border-bottom-color:var(--brand);color:var(--brand)}
.app[data-tema="laboratorio_clinico"] .nv:hover{background:var(--brand-tint)}
.app[data-tema="laboratorio_clinico"] .who{margin:0 0 0 auto;display:flex;gap:14px;align-items:center;padding:0;color:var(--ink)}
.app[data-tema="laboratorio_clinico"] .who button{margin:0}
.app[data-tema="laboratorio_clinico"] .who .rol{display:none}
.app[data-tema="laboratorio_clinico"] .main h1{font-size:28px;font-weight:700;font-stretch:108%;letter-spacing:-.01em;line-height:1.1}
.app[data-tema="laboratorio_clinico"] .pac{grid-template-columns:270px minmax(0,1fr)}
.app[data-tema="laboratorio_clinico"] .ficha{grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.app[data-tema="laboratorio_clinico"] .fside{position:sticky;top:12px}
.app[data-tema="laboratorio_clinico"] .tabs{border-bottom:1px solid var(--line);gap:0}
.app[data-tema="laboratorio_clinico"] .tab{border:0;border-bottom:3px solid transparent;background:transparent;border-radius:0}
.app[data-tema="laboratorio_clinico"] .tab[aria-selected="true"]{border-bottom-color:var(--brand);color:var(--brand)}
.app[data-tema="laboratorio_clinico"] .fila[aria-current="true"]{background:var(--brand-tint)}
.etiqueta{position:relative;display:grid;gap:10px;padding:16px 16px 14px 30px;background:#fff;border:1px solid var(--line);border-radius:10px}
.etiqueta::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;border-radius:10px 0 0 10px;
  background:linear-gradient(var(--edta) 0 16.66%,var(--sst) 0 33.33%,var(--cit) 0 50%,var(--hep) 0 66.66%,var(--flu) 0 83.33%,var(--ser) 0)}
.etiqueta h2{font-size:22px;line-height:1.1;font-weight:700;font-stretch:104%;letter-spacing:-.01em;text-wrap:balance}
.etiqueta .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px}
.etiqueta .kv span{color:var(--muted)}
.etiqueta .bar{display:block;width:100%;height:46px}
.etiqueta .code{font-size:12px;letter-spacing:.08em;color:var(--muted);word-break:break-all}
.etiqueta .al{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1.5px solid var(--alert);background:var(--alert-tint);color:var(--alert);border-radius:8px;font-weight:700;font-size:14px}
.etiqueta .al.ok{border-color:var(--ok);background:var(--ok-tint);color:var(--ok)}
.etiqueta .al.mut{border-color:var(--line);background:#fff;color:var(--muted)}
details.rack{background:#fff;border:1px solid var(--line);border-radius:10px}
details.rack summary{list-style:none;cursor:pointer;display:grid;gap:8px;padding:14px 16px}
details.rack summary::-webkit-details-marker{display:none}
details.rack[open] summary{border-bottom:1px solid var(--line)}
.rk-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.rk-top b{font-size:17px;font-weight:600;font-stretch:100%}
.rk-top span{color:var(--muted);font-size:14px}
.tubes{display:flex;flex-wrap:wrap;gap:6px}
.tube{display:inline-flex;align-items:center;gap:7px;padding:2px 12px 2px 4px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:600}
.tube i{display:block;width:16px;height:16px;border-radius:50%}
.rk-b{display:grid;gap:14px;padding:14px 16px 16px}
.rk-s{display:grid;gap:6px}
.rk-s>b{display:flex;gap:8px;align-items:center;font-size:14px}
.rk-s>b i{display:block;width:10px;height:18px;border-radius:3px 3px 5px 5px}

/* ===== CLÍNICA ODONTOLÓGICA: esmalte, acero y encía ===== */
.app[data-tema="clinica_odontologica"]{
  --font:'Lexend','Segoe UI',system-ui,sans-serif;
  --bg:#F2F4F5;--surface:#FFFFFF;--ink:#1F272D;--muted:#515D67;--line:#D5DBE0;--line-strong:#8E9AA5;
  --brand:#A3234F;--brand-ink:#FFFFFF;--brand-tint:#F9E7EE;--alert:#B42318;--alert-tint:#FDECEA;--ok:#14663F;--ok-tint:#E1F3E9;--focus:#A3234F;
  --bw:1px;--r-btn:10px;--r-in:10px;--r-card:14px;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
.app[data-tema="clinica_odontologica"] .nav{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:10px 28px;background:#fff;border-bottom:1px solid var(--line)}
.app[data-tema="clinica_odontologica"] .brand{margin:0;padding:0;display:flex;gap:10px;align-items:center}
.app[data-tema="clinica_odontologica"] .brand strong{font-size:18px;font-weight:600;letter-spacing:-.02em}
.app[data-tema="clinica_odontologica"] .brand span{display:none}
.app[data-tema="clinica_odontologica"] .navlist{display:flex;gap:6px;flex-wrap:wrap}
.app[data-tema="clinica_odontologica"] .nv{border-radius:10px;padding:0 16px;font-weight:500}
.app[data-tema="clinica_odontologica"] .nv:hover{background:var(--brand-tint)}
.app[data-tema="clinica_odontologica"] .nv[aria-current="page"]{background:var(--brand);color:#fff;font-weight:600}
.app[data-tema="clinica_odontologica"] .who{margin:0 0 0 auto;display:flex;gap:14px;align-items:center;padding:0}
.app[data-tema="clinica_odontologica"] .who button{margin:0}
.app[data-tema="clinica_odontologica"] .who .rol{color:var(--muted)}
.app[data-tema="clinica_odontologica"] .main h1{font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.app[data-tema="clinica_odontologica"] .tabs{display:inline-flex;background:#E4E8EB;border-radius:12px;padding:4px;gap:2px;width:fit-content;max-width:100%}
.app[data-tema="clinica_odontologica"] .tab{border:0;background:transparent;border-radius:9px;font-weight:500;min-height:40px}
.app[data-tema="clinica_odontologica"] .tab[aria-selected="true"]{background:#fff;color:var(--brand);font-weight:600}
.app[data-tema="clinica_odontologica"] .fila[aria-current="true"]{background:var(--brand-tint);box-shadow:none;border-color:var(--brand)}
.app[data-tema="clinica_odontologica"] .btn{font-weight:600}
.dhead{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;justify-content:space-between;padding:16px 20px;background:#fff;border:1px solid var(--line);border-radius:14px}
.dhead h2{font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.dhead .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;color:var(--muted);font-size:14px;align-items:center}
.nota{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:14px}
.nota .dia{display:grid;justify-items:center;align-content:start;line-height:1.05}
.nota .dia b{font-size:28px;font-weight:600}
.nota .dia span{font-size:13px;color:var(--muted)}
.nota h3{font-size:17px;font-weight:600;line-height:1.3}
.nota .quien{color:var(--muted);font-size:14px;margin:2px 0 10px}
.nota .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 22px}
.nota .cols>div{display:grid;gap:4px;align-content:start}
.nota .cols b{font-size:14px;font-weight:600}
/* odontograma */
.od{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.od-chart{display:grid;gap:12px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:14px;min-width:0}
.od-scroll{overflow-x:auto}
.od-scroll svg{display:block;min-width:620px;width:100%;height:auto}
.od-top{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center}
.od-top label{display:inline-flex;gap:8px;align-items:center;font-size:14px;min-height:36px}
.od-top input{width:18px;height:18px;accent-color:var(--brand)}
.leyenda{display:flex;flex-wrap:wrap;gap:6px}
.ley{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:2px 10px 2px 3px;border:1px solid var(--line);border-radius:999px;background:#fff}
.sw{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 3px;border-radius:6px;font-size:11px;font-weight:700;line-height:1;border:1px solid rgba(0,0,0,.18)}
.sw.sr{background:#fff;border:1.5px dashed #8E9AA5}
.od-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 22px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:14px;align-content:start}
.od-panel>h3,.od-panel>p,.od-panel>.err,.od-panel>.row{grid-column:1/-1}
.od-panel h3{font-size:19px;font-weight:600}
.estados{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.est{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 8px 4px 5px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;text-align:left;font-size:13px;line-height:1.15}
.est[aria-checked="true"]{border:2px solid var(--brand);background:var(--brand-tint);font-weight:600}
.sups{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:14px}
.sups label{display:flex;gap:8px;align-items:center;min-height:32px}
.sups input{width:18px;height:18px;accent-color:var(--brand)}
.tooth{cursor:pointer}
.tooth:focus-visible{outline:none}
.tooth:focus-visible .ring{stroke:#A3234F;stroke-width:3;opacity:1}
.ring{fill:none;stroke:#A3234F;stroke-width:3;opacity:0}
.tooth[aria-pressed="true"] .ring{opacity:1}
/* agenda */
.ag-head{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.ag-nav{display:flex;gap:8px;align-items:center}
.ag-nav h1{min-width:15ch;text-align:center}
.ag-scroll{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
.ag{display:grid;grid-template-columns:56px repeat(2,minmax(240px,1fr));min-width:600px;padding-bottom:16px}
.ag-hd{padding:12px 14px;font-weight:600;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:#FAFBFB}
.ag-hd small{display:block;font-weight:400;color:var(--muted)}
.ag-time{position:relative;height:576px}
.ag-time span{position:absolute;right:8px;transform:translateY(-50%);font-size:12px;color:var(--muted)}
.ag-col{position:relative;height:576px;border-left:1px solid var(--line);cursor:cell;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(#EBEFF1 1px,transparent 1px);background-size:100% 64px,100% 32px}
.cita{position:absolute;left:6px;right:6px;border-radius:9px;padding:4px 10px;overflow:hidden;cursor:pointer;text-align:left;border:1px solid var(--brand);background:var(--brand-tint);color:var(--ink);font-size:13px;line-height:1.25;display:grid;align-content:start}
.cita b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cita small{color:var(--muted);font-size:12px}
.cita.atendida{background:var(--ok-tint);border-color:var(--ok)}
.cita.cancelada{background:#EEF0F2;border-color:#9AA5AF;color:var(--muted)}
.cita.cancelada b{text-decoration:line-through}
.cita.no_asistio{background:#FFF1D6;border-color:#B7791F}

/* ===== Hospital General: módulos ampliados (señalética, folios y tablero) ===== */
.app[data-tema="hospital_general"]{--amb:#7A4F00;--amb-t:#FFF0CC;--gry:#4A5468;--gry-t:#E6E9F0;--sol:#F2B636}
.app [hidden]{display:none!important}
.hx-gl{font-size:12.5px;font-weight:700;color:#C9D3FF;padding:12px 14px 4px}
.app[data-tema="hospital_general"] .navlist{gap:2px}
.app[data-tema="hospital_general"] .nv .bd{margin-left:auto;margin-right:12px;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:#fff;color:var(--alert);font-size:13px;font-weight:700;display:inline-grid;place-items:center}
.app[data-tema="hospital_general"] .nv[aria-current="page"] .bd{background:var(--alert);color:#fff}
.who .hx-me{display:flex;gap:10px;align-items:center;justify-self:stretch;width:100%;margin:0;padding:6px 8px 6px 0;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer;text-decoration:none;font-weight:400;border-radius:3px 0 0 3px}
.who .hx-me:hover,.who .hx-me[aria-current="page"]{background:rgba(255,255,255,.16)}
.hx-av{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none;font-size:16px;margin-left:6px}
.hx-me b{display:block;font-size:15px;line-height:1.2}
.hx-me span span{font-size:13px;color:#D6DDFF;display:block}
.app[data-tema="hospital_general"] .who{gap:4px}

/* Barra de situación */
.hx-sit{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.hx-fecha{display:grid;align-content:center;padding-right:14px;line-height:1.2}
.hx-fecha b{font-size:16px}.hx-fecha span{font-size:13px;color:var(--muted)}
.hx-sc{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);background:#fff;cursor:pointer;min-height:46px;padding:0;text-align:left}
.hx-sc:hover{background:var(--brand-tint)}
.hx-sc i{display:grid;place-items:center;width:42px}
.hx-sc span{display:grid;align-content:center;padding:0 14px 0 10px;line-height:1.15}
.hx-sc small{font-size:12px;color:var(--muted)}
.hx-sc b{font-size:17px}
.hx-sc.em i{background:var(--alert);color:#fff}.hx-sc.ok i{background:var(--ok);color:#fff}.hx-sc.bl i{background:var(--brand);color:#fff}.hx-sc.am i{background:var(--sol);color:#2B1B00}

/* Tarjetas y rejilla */
.hx-g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.s12{grid-column:span 12}.s7{grid-column:span 7}.s5{grid-column:span 5}.s6{grid-column:span 6}
.hx-c{background:#fff;border:1.5px solid var(--ink);display:grid;align-content:start;min-width:0}
.hx-ch{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--brand-tint);border-bottom:1.5px solid var(--ink)}
.hx-ch h2{font-size:17px;font-weight:700}
.hx-ch small{color:var(--muted);font-size:13px}
.hx-cb{padding:14px;display:grid;gap:12px;min-width:0}
.hx-h1{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.hx-h1 p{color:var(--muted)}

/* Indicadores de estado */
.hx-sq{display:inline-grid;place-items:center;flex:none;border:1.5px solid var(--ink);font-size:12px;font-weight:700;line-height:1}
.bd-D{background:#fff;color:var(--ok);border-color:var(--ok)}
.bd-O{background:var(--brand);color:#fff;border-color:var(--brand)}
.bd-L{background:var(--amb-t);color:var(--amb);border-color:#C98A00}
.bd-M{background:repeating-linear-gradient(135deg,#E6E9F0 0 4px,#fff 4px 8px);color:var(--gry);border-color:var(--gry)}
.hx-pill{display:inline-flex;align-items:center;gap:6px;padding:1px 10px 1px 7px;border:1.5px solid currentColor;border-radius:3px;font-size:13px;font-weight:700;line-height:1.6;white-space:nowrap;background:#fff}
.hx-pill.ok{color:var(--ok);background:var(--ok-tint)}
.hx-pill.bl{color:var(--brand);background:var(--brand-tint)}
.hx-pill.am{color:var(--amb);background:var(--amb-t)}
.hx-pill.gr{color:var(--gry);background:var(--gry-t)}
.hx-pill.gr.x{text-decoration:line-through}
.hx-pill.em{color:#fff;background:var(--alert);border-color:var(--alert)}
.hx-pill.sl{color:#fff;background:var(--brand);border-color:var(--brand)}
.hx-bar{display:flex;height:24px;border:1.5px solid var(--ink);background:#fff;overflow:hidden}
.hx-bar i{display:block;height:100%;border-right:1.5px solid #fff;font-style:normal}
.hx-bar i:last-child{border-right:0}
.hx-leg{display:grid;gap:8px}
.hx-lg{display:flex;align-items:center;gap:10px;font-size:14px}
.hx-lg b{margin-left:auto;font-size:16px}
.hx-ring{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.hx-mini{display:grid;gap:10px}
.hx-mr{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:center}
.hx-mr b{font-size:14px}
.hx-mr .sqs{display:flex;flex-wrap:wrap;gap:4px}
.hx-mr small{color:var(--muted);font-size:13px}
.hx-link{border:0;background:transparent;color:var(--brand);font-weight:700;text-decoration:underline;cursor:pointer;padding:0;text-align:left}

/* Emergencias */
.hx-ems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hx-em{display:grid;grid-template-columns:92px minmax(0,1fr);border:1.5px solid var(--ink);background:#fff}
.hx-em .cm{background:var(--alert);color:#fff;display:grid;align-content:center;justify-items:center;gap:4px;padding:10px 4px}
.hx-em .cm b{font-size:26px;line-height:1}
.hx-em .cm span{font-size:12px}
.hx-em .bd{display:grid;gap:10px;padding:12px 14px;min-width:0}
.hx-em h3{font-size:18px;line-height:1.2}
.hx-em .mt{color:var(--muted);font-size:14px}
.hx-tm{display:grid;gap:4px}
.hx-tm .row2{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:14px}
.hx-tm .row2 b{font-size:18px}
.hx-axis{position:relative;height:12px;border:1.5px solid var(--ink);background:#fff}
.hx-axis i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.hx-axis u{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--line)}
.hx-ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.hx-chips{display:flex;flex-wrap:wrap;gap:6px}
.hx-acts{display:flex;flex-wrap:wrap;gap:8px}

/* Camas */
.hx-fl{display:flex;flex-wrap:wrap;gap:8px}
.hx-f{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 10px;border:1.5px solid var(--ink);background:#fff;cursor:pointer;font-weight:700}
.hx-f[aria-pressed="true"]{background:var(--ink);color:#fff}
.hx-f b{font-size:16px}
.hx-rooms{display:flex;flex-wrap:wrap;gap:12px}
.hx-room{border:1.5px solid var(--line);padding:8px 10px 10px;background:#FAFBFD;display:grid;gap:8px}
.hx-rn{font-size:12.5px;color:var(--muted)}
.hx-beds{display:flex;gap:8px}
.hx-bed{display:grid;gap:3px;align-content:start;width:132px;min-height:88px;padding:8px 10px;border:1.5px solid var(--ink);background:#fff;text-align:left;cursor:pointer;color:var(--ink)}
.hx-bed .cd{display:flex;gap:8px;align-items:center}
.hx-bed .cd b{font-size:16px}
.hx-bed .es{font-size:13px;font-weight:700}
.hx-bed .oc{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hx-bed.bd-O{background:var(--brand-tint);color:var(--ink);border-color:var(--brand)}
.hx-bed.bd-O .es{color:var(--brand)}
.hx-bed.bd-D .es{color:var(--ok)}
.hx-bed.bd-L{background:var(--amb-t);color:var(--ink)}.hx-bed.bd-L .es{color:var(--amb)}
.hx-bed.bd-M{background:var(--gry-t);color:var(--ink)}.hx-bed.bd-M .es{color:var(--gry)}
.hx-bed.dim{opacity:.32}
.hx-bed:hover{outline:2px solid var(--ink)}

/* Tablas */
.hx-tw{overflow-x:auto;background:#fff;border:1.5px solid var(--ink)}
.hx-t{width:100%;border-collapse:collapse;font-size:14.5px;min-width:720px}
.hx-t th{text-align:left;padding:9px 12px;background:var(--brand-tint);border-bottom:1.5px solid var(--ink);font-size:13.5px;white-space:nowrap}
.hx-t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.hx-t tr:last-child td{border-bottom:0}
.hx-t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hx-t td small{display:block;color:var(--muted);font-size:13px}
.hx-t tr.mine td:first-child{box-shadow:inset 4px 0 0 var(--brand)}
.hx-days{display:flex;flex-wrap:wrap;gap:8px}
.hx-day{display:grid;gap:2px;min-width:132px;padding:8px 14px;border:1.5px solid var(--ink);background:#fff;cursor:pointer;text-align:left}
.hx-day[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.hx-day small{font-size:12.5px;opacity:.85}
.hx-day b{font-size:16px}
.hx-prog{height:10px;border:1.5px solid var(--ink);background:#fff;min-width:90px}
.hx-prog i{display:block;height:100%;background:var(--ok)}
.hx-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.hx-kpi{display:grid;gap:2px;border:1.5px solid var(--ink);background:#fff;padding:8px 12px 10px}
.hx-kpi small{font-size:12.5px;color:var(--muted)}
.hx-kpi b{font-size:26px;line-height:1.1}
.hx-kpi.am{border-left:8px solid var(--sol)}.hx-kpi.ok{border-left:8px solid var(--ok)}.hx-kpi.bl{border-left:8px solid var(--brand)}

/* Ficha: indicadores y recorrido */
.hx-ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:8px}
.hx-it{display:flex;align-items:stretch;border:1.5px solid var(--ink);background:#fff;min-width:0}
.hx-it i{display:grid;place-items:center;width:40px;flex:none;background:var(--gry-t);color:var(--gry)}
.hx-it span{display:grid;align-content:center;padding:6px 10px;line-height:1.15;min-width:0}
.hx-it small{font-size:12px;color:var(--muted)}
.hx-it b{font-size:15px}
.hx-it.al i{background:var(--alert);color:#fff}.hx-it.ok i{background:var(--ok);color:#fff}.hx-it.bl i{background:var(--brand);color:#fff}.hx-it.am i{background:var(--sol);color:#2B1B00}
.pulsera .gs{display:grid;place-items:center;align-content:center;gap:0;width:62px;flex:none;margin:12px 8px 12px 6px;border-radius:50%;border:1.5px solid var(--ink);background:var(--brand);color:#fff;line-height:1}
.pulsera .gs b{font-size:19px}
.hx-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hx-n{display:flex;gap:8px;align-items:center;padding:5px 10px;border:1.5px solid var(--ink);background:#fff;line-height:1.1}
.hx-n small{display:block;font-size:11.5px;color:var(--muted)}
.hx-n b{font-size:14px}
.hx-n.ok{background:var(--ok-tint);border-color:var(--ok);color:var(--ok)}
.hx-n.ok small,.hx-n.bl small,.hx-n.am small{color:inherit}
.hx-n.bl{background:var(--brand-tint);border-color:var(--brand);color:var(--brand)}
.hx-n.am{background:var(--amb-t);border-color:#C98A00;color:var(--amb)}
.hx-n.no{border-style:dashed;border-color:var(--line);color:var(--muted)}
.hx-sep{color:var(--muted);display:inline-flex}
.fo-h .hx-pill{margin-left:0}
.fo-h .chip{margin-left:auto}
.hx-txs{display:grid;gap:8px}
.hx-txs li{display:grid;gap:2px}
.hx-txs li div{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}

/* Perfil */
.hx-perf{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.hx-gaf{border:1.5px solid var(--ink);background:#fff;display:grid;justify-items:center;text-align:center;padding-bottom:18px;position:relative}
.hx-gaf::before{content:"";width:64px;height:12px;border:1.5px solid var(--ink);border-radius:999px;background:var(--bg);margin:10px 0 0}
.hx-gaf .top{align-self:stretch;background:var(--brand);color:#fff;padding:10px 12px;margin-top:10px;font-weight:700}
.hx-gaf .av{width:96px;height:96px;border-radius:50%;background:var(--brand-tint);color:var(--brand);border:1.5px solid var(--ink);display:grid;place-items:center;font-size:34px;font-weight:700;margin:18px 0 8px}
.hx-gaf h2{font-size:21px;line-height:1.15;padding:0 12px}
.hx-gaf p{color:var(--muted);font-size:14px}
.hx-gaf .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 14px 0}
.hx-perm{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 18px}
.hx-perm li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.hx-perm li.no{color:var(--muted)}
.hx-perm svg{margin-top:2px}
.hx-ses{display:grid;gap:6px}
.hx-ses .hx-axis{height:14px}

.hx-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.hx-list li:last-child{border-bottom:0}
.hx-list b{display:block;font-size:15px}
.hx-list small{color:var(--muted);font-size:13px}
.hx-sech{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 10px;align-items:center}
.hx-lock{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--gry);border:1.5px solid var(--gry);padding:0 8px;line-height:1.6;background:var(--gry-t)}
.hx-cut{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hx-rule{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px dashed var(--gry);background:#fff;font-size:14px}
@media (max-width:1100px){.s7,.s5,.s6{grid-column:span 12}.hx-ems{grid-template-columns:minmax(0,1fr)}.hx-perf{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .hx-gl{display:none}
  .who .hx-me{width:auto}
  .hx-ring{grid-template-columns:minmax(0,1fr);justify-items:start}
  .hx-mr{grid-template-columns:minmax(0,1fr)}
  .hx-beds{flex-wrap:wrap}
  .hx-bed{width:calc(50% - 4px);min-width:120px}
  .hx-sc{flex:1 1 150px}
}

/* ===== Pediatría, laboratorio y odontología: módulos ampliados ===== */
/* ===== Extensiones por institución: piezas genéricas (usan los tokens de cada piel) ===== */
.app{--amb:#7A4F00;--amb-t:#FFF0CC;--gry:#4A5468;--gry-t:#E6E9F0;--sol:#F2B636}
.chip.am{color:var(--amb);background:var(--amb-t)}
.chip.bl{color:var(--ink);background:var(--brand-tint)}
.chip.gr{color:var(--gry);background:var(--gry-t)}
.chip.x{text-decoration:line-through}
.k-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.k-t{display:grid;gap:2px;padding:10px 14px 12px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);align-content:start}
.k-t small{font-size:13px;color:var(--muted)}
.k-t b{font-size:26px;line-height:1.1}
.k-t.ok{border-left:8px solid var(--ok)}.k-t.am{border-left:8px solid var(--sol)}.k-t.al{border-left:8px solid var(--alert)}.k-t.bl{border-left:8px solid var(--brand)}
.crd{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);display:grid;align-content:start;min-width:0;overflow:hidden}
.crd-h{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:var(--bw) solid var(--line)}
.crd-h h2{font-size:17px;font-weight:700}
.crd-h small{color:var(--muted);font-size:13px}
.crd-b{padding:14px 16px;display:grid;gap:12px;min-width:0}
.tbl-w{overflow-x:auto;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:640px}
.tbl th{text-align:left;padding:10px 12px;background:var(--brand-tint);font-size:13px;font-weight:700;white-space:nowrap;border-bottom:var(--bw) solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl td small{display:block;color:var(--muted);font-size:13px}
.lk{border:0;background:transparent;color:var(--ink);font-weight:700;text-decoration:underline;cursor:pointer;padding:0;text-align:left}
.pr{height:10px;border:1px solid var(--line-strong);background:#fff;min-width:80px;border-radius:999px;overflow:hidden}
.pr i{display:block;height:100%;background:var(--ok);font-style:normal}
.stk{display:flex;height:24px;border:1px solid var(--line-strong);background:#fff;overflow:hidden;border-radius:999px}
.stk i{display:grid;place-items:center;height:100%;font-size:12.5px;font-weight:700;font-style:normal;border-right:2px solid #fff}
.stk i:last-child{border-right:0}
.bdg{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--alert);color:#fff;font-size:12.5px;font-weight:700;margin-left:6px}
.sech{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 10px;align-items:center}
.vlist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.vlist li:last-child{border-bottom:0}
.vlist b{display:block}
.vlist small{color:var(--muted);font-size:13px}
.rule2{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:var(--r-in);background:var(--surface);font-size:14px}
.stack{display:grid;gap:18px}

/* ----- Pediatría ----- */
.pg-now{display:flex;flex-wrap:wrap;gap:14px}
.pg-disc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:12px 18px 12px 12px;background:#fff;border:2px solid var(--ink);border-radius:999px;min-width:250px}
.pg-disc .c{display:grid;place-items:center;align-content:center;width:84px;height:84px;border-radius:50%;border:2px solid var(--ink);background:var(--brand);line-height:1}
.pg-disc .c b{font-size:32px;font-weight:800;font-stretch:80%;letter-spacing:-.02em}
.pg-disc .c span{font-size:13px;font-weight:700}
.pg-disc.t .c{background:#FFD23F}
.pg-disc.p .c{background:#fff}
.pg-disc small{font-size:13px;color:var(--muted)}
.pg-disc strong{display:block;font-size:19px;line-height:1.2}
.pg-mt{position:relative;height:12px;border:2px solid var(--ink);border-radius:999px;background:#fff;min-width:110px}
.pg-mt u{position:absolute;top:0;bottom:0;border-left:1px solid var(--ink);opacity:.35}
.pg-mt i{position:absolute;top:-5px;width:14px;height:20px;margin-left:-7px;background:var(--ink);border-radius:5px;border:2px solid #fff;box-sizing:border-box}
.pg-mt .bnd{position:absolute;top:0;bottom:0;left:15%;width:70%;background:#FFE9A8}
.pg-mtw{display:grid;gap:3px}
.pg-mtw .lb{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.pg-chart svg{display:block;width:100%;height:auto;min-width:520px}
.pg-leg{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px}
.pg-leg span{display:inline-flex;gap:8px;align-items:center}
.pg-vacs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pg-vac{display:grid;gap:10px;padding:14px;background:#fff;border:2px solid var(--ink);border-radius:20px;align-content:start}
.pg-vac h3{font-size:18px;line-height:1.15;font-weight:800;font-stretch:88%}
.pg-vac .en{font-size:13px;color:var(--muted)}
.pg-doses{display:flex;flex-wrap:wrap;gap:8px}
.pg-dose{display:grid;gap:1px;padding:6px 12px 7px 10px;border:2px solid var(--ink);border-radius:14px;background:#fff;min-width:118px;font-size:13px;line-height:1.25}
.pg-dose b{display:flex;gap:6px;align-items:center;font-size:14px}
.pg-dose.ok{background:var(--ok-tint)}
.pg-dose.pe{background:#fff;border-style:dashed}
.pg-dose.at{background:#FFE1DC;border-style:dashed}
.pg-dose.ca{background:#EEF1F1;text-decoration:line-through;color:var(--muted)}
.pg-ruler{position:relative;height:122px;margin:6px 10px 0}
.pg-ruler::before{content:"";position:absolute;left:0;right:0;top:38px;height:6px;background:var(--ink);border-radius:3px}
.pg-tk{position:absolute;top:0;bottom:0;width:170px;margin-left:-85px;text-align:center;font-size:12.5px;line-height:1.25}
.pg-tk i{position:absolute;left:50%;top:32px;margin-left:-9px;width:18px;height:18px;border-radius:50%;background:#FFD23F;border:2px solid var(--ink)}
.pg-tk b{position:absolute;left:0;right:0;top:4px;font-size:14px}
.pg-tk span{position:absolute;left:0;right:0;top:62px}
@media (max-width:760px){
  .pg-ruler{height:auto;display:grid;gap:10px;margin:0}
  .pg-ruler::before{display:none}
  .pg-tk{position:static;width:auto;margin:0;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;left:auto!important;align-items:center}
  .pg-tk b,.pg-tk i,.pg-tk span{position:static;margin:0}
  .pg-tk i{grid-row:1/3;grid-column:1}.pg-tk b{grid-column:2}.pg-tk span{grid-column:2}
}
.pg-tut{display:grid;gap:8px;padding:14px 16px;background:#fff;border:2px solid var(--ink);border-radius:20px}
.pg-tut h3{font-size:19px;font-weight:800;font-stretch:88%}
.pg-imp{padding:8px 12px;border:2px dashed var(--ink);border-radius:14px;background:#FFF9DD;font-size:14.5px}
.pg-ctrl{display:inline-flex;gap:8px;align-items:center;padding:4px 12px;border:2px solid var(--ink);border-radius:999px;background:#FFD23F;font-weight:700;font-size:13.5px;cursor:pointer}
.pg-main{display:inline-block;padding:0 8px;border-radius:999px;background:var(--ink);color:#FFD23F;font-size:11.5px;font-weight:700;margin-left:6px;vertical-align:middle}
.app[data-tema="centro_pediatrico"] .tbl-w,.app[data-tema="centro_pediatrico"] .crd,.app[data-tema="centro_pediatrico"] .k-t{border-width:2px;border-color:var(--ink)}
.app[data-tema="centro_pediatrico"] .tbl th{background:#FFD23F;border-bottom:2px solid var(--ink)}
.app[data-tema="centro_pediatrico"] .crd-h{background:#FFF1B8;border-bottom:2px solid var(--ink)}
.app[data-tema="centro_pediatrico"] .k-t{border-radius:20px}
.app[data-tema="centro_pediatrico"] .pr,.app[data-tema="centro_pediatrico"] .stk{border:2px solid var(--ink)}
.app[data-tema="centro_pediatrico"] .lk{color:var(--ink)}

/* ----- Laboratorio ----- */
.app[data-tema="laboratorio_clinico"]{--uri:#EE8F3A}
.lb-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.lb-col{display:grid;gap:10px;align-content:start;padding:10px;background:#EFECF7;border-radius:12px;min-width:0}
.lb-col>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 4px 4px;font-weight:700}

.lb-rng .p{position:absolute;top:-3px;width:22px;height:22px;margin-left:-11px;display:grid;place-items:center;border:2px solid #fff;background:var(--ink);color:#fff;font-size:10px;border-radius:50%;box-sizing:border-box}

.lb-tube small{display:block;color:var(--muted);font-size:12.5px}
.lb-cat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:#fff;border-left:0;border-right:0;border-top:0;text-align:left}

        ['401','Vuelve al login.','Tu sesión venció. Inicia sesión de nuevo para continuar.'],
        ['403','La sección no aparece en el menú. Si alguien entra por un enlace, ve este texto.','No tienes permiso para ver esta información.'],
        ['404','Cierra la ficha y vuelve a la búsqueda.','No encontramos a este paciente. Búscalo de nuevo por nombre.'],
        ['409','Muestra el mensaje en la ficha o en el formulario.','Este historial está archivado y no admite cambios. Ese horario ya está ocupado para este profesional. Elige otra hora.'],
        ['422','Marca el campo y dice cómo corregirlo.','La fecha de nacimiento no puede ser futura.'],
        ['501','Reemplaza el contenido de la sección.','Esta función todavía no está disponible para tu institución.'],
        ['503','Reemplaza el contenido y ofrece reintentar.','El servicio de datos no está disponible. Intenta de nuevo en unos minutos.']
      ].map(r=>h('tr',null,r.map(c=>h('td',{text:c})))))))));
}

/* ---------- render ---------- */
function render(){
  const y=window.scrollY;
  renderReview();
  const login=S.view==='login',sis=S.view==='sistema';
  $('stage').hidden=sis;$('sis').hidden=!sis;$('fnote').hidden=true;
  if(sis){sistemaView();return}
  const m=$('mount');m.textContent='';
  m.append(login?loginView():appView());
  const f=document.activeElement;
  window.scrollTo(0,y);
  const fn=$('fnote');
  fn.hidden=false;
  fn.textContent=login?'Login único y neutro. Tras iniciar sesión, la institución de la cuenta decide la piel y las secciones disponibles.':
    `${INST[S.tema].nombre}: sesión de ${cuenta().nombre}, ${cuenta().rol.toLowerCase()}. ${can('historiales:leer')?'Ve historial, alergias y puede archivar.':'No ve historial, alergias ni odontograma y no puede archivar.'}${S.tema==='hospital_general'?' Emergencias, camas, citas, atenciones y pagos son una maqueta construida con las tablas de 001_hospital_general.sql. La API actual solo expone pacientes e historiales.':S.tema==='centro_pediatrico'?' Crecimiento, vacunación, tutores y facturación salen de 001_hospital_pediatrico.sql. Son maqueta: la API actual solo expone pacientes e historiales.':S.tema==='laboratorio_clinico'?' Órdenes, muestras, resultados y catálogo salen de laboratorio_clinico_mongo.js. Son maqueta: la API actual solo expone pacientes e historiales.':" Odontograma, citas y agenda salen de las colecciones descritas en docs/modelo_odontologia.md."}`;
}
render();
</script>
