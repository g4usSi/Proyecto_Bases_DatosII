name: historiales_clinicos

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hospital_general
      POSTGRES_USER: historiales_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta python -m scripts.configurar_desarrollo}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Falta POSTGRES_APP_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_datos:/var/lib/postgresql/data
      - ./database/postgresql/001_hospital_general.sql:/docker-entrypoint-initdb.d/001_hospital.sql:ro
      - ./database/postgresql/002_identidad.sql:/docker-entrypoint-initdb.d/002_identidad.sql:ro
      - ./database/postgresql/003_vinculo_profesional.sql:/docker-entrypoint-initdb.d/003_vinculo.sql:ro
      - ./database/postgresql/004_permisos.sql:/docker-entrypoint-initdb.d/004_permisos.sql:ro
      - ./database/postgresql/005_proteger_login.sql:/docker-entrypoint-initdb.d/005_proteger_login.sql:ro
      - ./database/postgresql/006_rol_secretaria_citas.sql:/docker-entrypoint-initdb.d/006_rol_secretaria_citas.sql:ro
      - ./database/postgresql/007_secretaria_restricciones.sql:/docker-entrypoint-initdb.d/007_secretaria_restricciones.sql:ro
      - ./database/postgresql/008_escritura_api.sql:/docker-entrypoint-initdb.d/008_escritura_api.sql:ro
      - ./database/postgresql/009_citas_adendas_edicion.sql:/docker-entrypoint-initdb.d/009_citas_adendas_edicion.sql:ro
      - ./database/postgresql/010_integridad_hospital.sql:/docker-entrypoint-initdb.d/010_integridad_hospital.sql:ro
      - ./database/postgresql/011_permisos_laboratorio.sql:/docker-entrypoint-initdb.d/011_permisos_laboratorio.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U historiales_admin -d hospital_general"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hospital_pediatrico
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD}
      MYSQL_USER: historiales_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_datos:/var/lib/mysql
      - ./database/mysql/001_hospital_pediatrico.sql:/docker-entrypoint-initdb.d/001_hospital.sql:ro
      - ./database/mysql/002_integridad.sql:/docker-entrypoint-initdb.d/002_integridad.sql:ro
      - ./database/mysql/003_permisos.sql:/docker-entrypoint-initdb.d/003_permisos.sql:ro
      - ./database/mysql/004_escritura_api.sql:/docker-entrypoint-initdb.d/004_escritura_api.sql:ro
      - ./database/mysql/005_permisos_escritura.sql:/docker-entrypoint-initdb.d/005_permisos_escritura.sql:ro
      - ./database/mysql/006_citas_adendas_edicion.sql:/docker-entrypoint-initdb.d/006_citas_adendas_edicion.sql:ro
      - ./database/mysql/007_permisos_extensiones.sql:/docker-entrypoint-initdb.d/007_permisos_extensiones.sql:ro
      - ./database/mysql/008_pediatria.sql:/docker-entrypoint-initdb.d/008_pediatria.sql:ro
      - ./database/mysql/009_permisos_pediatria.sql:/docker-entrypoint-initdb.d/009_permisos_pediatria.sql:ro
      - ./database/mysql/010_sin_stock_vacunas.sql:/docker-entrypoint-initdb.d/010_sin_stock_vacunas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -u historiales_app -D hospital_pediatrico -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: historiales_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Falta MONGO_ROOT_PASSWORD}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Falta MONGO_APP_PASSWORD}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_datos:/data/db
      - ./laboratorio_clinico_mongo.js:/docker-entrypoint-initdb.d/001_laboratorio.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    profiles: ["api"]
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      HISTORIALES_ENVIRONMENT: desarrollo
      HISTORIALES_POSTGRES_DSN: postgresql://historiales_app:${POSTGRES_APP_PASSWORD}@postgres:5432/hospital_general
      HISTORIALES_JWT_SECRET: ${HISTORIALES_JWT_SECRET:?Falta HISTORIALES_JWT_SECRET}
      HISTORIALES_MYSQL_HOST: mysql
      HISTORIALES_MYSQL_PORT: 3306
      HISTORIALES_MYSQL_USER: historiales_app
      HISTORIALES_MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      HISTORIALES_MONGODB_URI: mongodb://historiales_app:${MONGO_APP_PASSWORD}@mongo:27017/laboratorio_clinico?authSource=laboratorio_clinico
      # La clave NO se copia a la imagen: se monta de solo lectura desde .secrets/.
      HISTORIALES_FIRESTORE_CREDENTIALS: /run/secrets/historiales/firebase-adminsdk.json
      HISTORIALES_FIRESTORE_DATABASE: ${HISTORIALES_FIRESTORE_DATABASE:-(default)}
    volumes:
      - ./.secrets:/run/secrets/historiales:ro
    depends_on:
      postgres: {condition: service_healthy}
      mysql: {condition: service_healthy}
      mongo: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_datos:
  mysql_datos:
  mongo_datos:
